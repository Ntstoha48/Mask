<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMA + FVG Signals</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--g:#16a34a;--r:#dc2626;--b:#2563eb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:8px;padding:8px 2px}
  header .pair{font-weight:700;font-size:18px}
  header .price{color:var(--mut);font-size:14px;flex:1}
  .dot{width:10px;height:10px;border-radius:50%;background:#64748b}
  .dot.ok{background:var(--g)} .dot.err{background:var(--r)}
  button,select,input{font:inherit}
  .btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 12px}
  .btn.ghost{background:var(--card);color:var(--tx)}
  #chart{flex:1;min-height:260px;border-radius:10px;overflow:hidden}
  .dash{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
  .dash div{background:var(--card);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;color:var(--mut)}
  .dash b{display:block;font-size:17px;color:var(--tx)}
  .dash .w b{color:#4ade80}.dash .l b{color:#f87171}
  #log{background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;height:92px;overflow:auto;margin-bottom:8px}
  #log div{padding:2px 0;border-bottom:1px solid #334155}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10;overflow:auto;padding:env(safe-area-inset-top) 12px 12px}
  #modal.open{display:block}
  .panel{background:var(--card);border-radius:12px;padding:14px;max-width:480px;margin:12px auto}
  .panel h3{margin:0 0 8px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
  .panel input[type=text],.panel input[type=password],.panel input[type=number],.panel select{width:100%;background:#0f172a;color:var(--tx);border:1px solid #334155;border-radius:8px;padding:9px}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .row label{margin:0;color:var(--tx);font-size:14px}
  .note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="pair" id="pairTxt">EURUSD</span>
  <span class="price" id="priceTxt">--</span>
  <button class="btn ghost" id="refreshBtn">↻</button>
  <button class="btn" id="setBtn">⚙ Settings</button>
</header>

<div id="chart"></div>

<div class="dash">
  <div>Total<b id="dT">0</b></div>
  <div class="w">Win<b id="dW">0</b></div>
  <div class="w">MTG Win<b id="dM">0</b></div>
  <div class="l">Loss<b id="dL">0</b></div>
  <div>Win Rate<b id="dR">0%</b></div>
</div>
<div id="log"></div>

<div id="modal">
  <div class="panel">
    <h3>Settings</h3>

    <label>OANDA API Key</label>
    <input type="password" id="key" autocomplete="off">
    <label>OANDA Account Type</label>
    <select id="env"><option value="practice">Practice (Demo)</option><option value="live">Live</option></select>

    <label>Pair (যেমন EURUSD, GBPUSD, XAUUSD)</label>
    <input type="text" id="pair" list="pairs" autocapitalize="characters">
    <datalist id="pairs"><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>AUDUSD</option><option>USDCAD</option><option>EURGBP</option><option>XAUUSD</option></datalist>

    <label>EMA Length</label>
    <input type="number" id="ema" min="2" max="200">
    <label>Dashboard Candle Count (কত কেন্ডেলের Win/Loss)</label>
    <input type="number" id="lookback" min="10" max="4700">

    <label>Telegram Bot Token</label>
    <input type="password" id="tgToken" autocomplete="off">
    <label>Telegram Channel / Chat ID (@channelname বা -100...)</label>
    <input type="text" id="tgChat">
    <div class="row"><input type="checkbox" id="tgOn"><label for="tgOn">Signal Telegram এ পাঠাও</label></div>
    <div class="row"><input type="checkbox" id="awake"><label for="awake">স্ক্রিন জাগিয়ে রাখো (Keep awake)</label></div>

    <div class="row">
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn ghost" id="testBtn">Telegram Test</button>
      <button class="btn ghost" id="closeBtn">Close</button>
    </div>
    <div class="note">API key ও token শুধু আপনার ফোনের ব্রাউজারে সেভ থাকে, অন্য কোথাও যায় না। Signal পাঠাতে এই পেজ খোলা এবং স্ক্রিন চালু থাকতে হবে।</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEF = {key:'',env:'practice',pair:'EUR_USD',ema:15,lookback:500,tgToken:'',tgChat:'',tgOn:true,awake:true};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('s') || '{}'));
const save = () => localStorage.setItem('s', JSON.stringify(S));
const pretty = p => p.replace('_','');
const normPair = p => { p = p.toUpperCase().replace(/[\/_ ]/g,''); return p.length===6 ? p.slice(0,3)+'_'+p.slice(3) : p; };

//STRAT-START
function calcEma(cl,n){const a=2/(n+1);let p=null;return cl.map(c=>p=(p===null?c:a*c+(1-a)*p));}
function runStrategy(cs,n){
  const ema=calcEma(cs.map(c=>c.c),n);let stage=0,d=0,brk=0,mtg=0;
  const sig=new Array(cs.length).fill(0),ev=[];
  for(let i=0;i<cs.length;i++){
    const {o,h,l,c}=cs[i];const up=c>o;
    const touch=l<=ema[i]&&ema[i]<=h&&c!==o;
    let buy=false,sell=false;
    if(i>=2){
      const p1=cs[i-1],p2=cs[i-2];
      const g=p2.c>p2.o&&p1.c>p1.o&&up;
      const r=p2.c<p2.o&&p1.c<p1.o&&c<o;
      buy=stage===2&&d===1&&l>p2.h&&g;
      sell=stage===2&&d===-1&&h<p2.l&&r;
    }
    let cont=false;
    if(stage===1) cont = d===1 ? (c>o&&c>brk) : (c<o&&c<brk);
    if(buy||sell) stage=0;
    else if(cont) stage=2;
    else if(touch){stage=1;d=up?1:-1;brk=c;}
    else if(stage===1) stage=0;
    sig[i]=buy?1:sell?-1:0;
    if(sig[i]) ev.push([i,'signal',sig[i]]);
    if(mtg!==0){
      const ok=mtg===1?c>=o:c<=o;
      ev.push([i,ok?'mtgwin':'loss',mtg]);mtg=0;
    } else if(i>0&&sig[i-1]!==0){
      const dd=sig[i-1];const ok=dd===1?c>=o:c<=o;
      if(ok) ev.push([i,'win',dd]); else mtg=dd;
    }
  }
  return {ema,ev};
}
//STRAT-END

// ===== Chart =====
const off = -new Date().getTimezoneOffset()*60;   // ফোনের লোকাল টাইম দেখানোর জন্য
const chart = LightweightCharts.createChart($('chart'), {
  autoSize:true,
  layout:{background:{color:'#0f172a'},textColor:'#cbd5e1'},
  grid:{vertLines:{color:'#1e293b'},horzLines:{color:'#1e293b'}},
  timeScale:{timeVisible:true,secondsVisible:false,rightOffset:6},
  rightPriceScale:{borderColor:'#334155'},
});
const candles = chart.addCandlestickSeries({upColor:'#16a34a',downColor:'#dc2626',borderVisible:false,wickUpColor:'#16a34a',wickDownColor:'#dc2626'});
const emaLine = chart.addLineSeries({color:'#3b82f6',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
let firstFit = true;

// ===== Data =====
async function fetchCandles(){
  const base = S.env==='live' ? 'https://api-fxtrade.oanda.com' : 'https://api-fxpractice.oanda.com';
  const count = Math.min(5000, S.lookback + 300);
  const r = await fetch(`${base}/v3/instruments/${S.pair}/candles?granularity=M1&count=${count}&price=M`,
    {headers:{Authorization:'Bearer '+S.key}});
  if(!r.ok) throw new Error('OANDA error '+r.status);
  const j = await r.json();
  return j.candles.map(c=>({t:Date.parse(c.time.slice(0,19)+'Z')/1000,o:+c.mid.o,h:+c.mid.h,l:+c.mid.l,c:+c.mid.c,done:c.complete}));
}

// ===== Telegram =====
async function tgSend(text){
  if(!S.tgToken||!S.tgChat) return false;
  try{
    const r = await fetch(`https://api.telegram.org/bot${S.tgToken}/sendMessage?`+new URLSearchParams({chat_id:S.tgChat,text}));
    const j = await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
const bd = (t,plusMin=0)=>{const d=new Date((t+plusMin*60)*1000+6*3600*1000);return d.toISOString().slice(11,16);};

function addLog(txt){
  const d=document.createElement('div');d.textContent=txt;
  $('log').prepend(d);
  while($('log').children.length>60) $('log').lastChild.remove();
}

// ===== Alerts (প্রথম লোডে পুরনো signal পাঠাবে না) =====
let seen=null, seenKey='';
function notify(cs,ev){
  const key=S.pair+'|'+S.ema+'|'+S.tgChat;
  const cur=new Map(ev.map(e=>[cs[e[0]].t+':'+e[1],e]));
  if(seenKey!==key||!seen){seen=new Set(cur.keys());seenKey=key;return;}
  const fresh=[];
  for(const [k,e] of cur){ if(!seen.has(k) && e[0]>=cs.length-3) fresh.push(e); }
  seen=new Set(cur.keys());
  for(const [i,kind,d] of fresh){
    const t=cs[i].t, p=pretty(S.pair);
    let msg;
    if(kind==='signal') msg=`${d===1?'🟢 BUY':'🔴 SELL'} | ${p} | 1m\nSignal candle: ${bd(t)}\n👉 Entry candle: ${bd(t,1)} (BD time)`;
    else if(kind==='win') msg=`✅ Win | ${p} | ${bd(t)}`;
    else if(kind==='mtgwin') msg=`✅ MTG Win | ${p} | ${bd(t)}`;
    else msg=`❌ Loss | ${p} | ${bd(t)}`;
    addLog(msg.replace(/\n/g,'  '));
    if(S.tgOn) tgSend(msg);
  }
}

// ===== Main refresh =====
let busy=false;
async function tick(){
  if(busy) return; busy=true;
  try{
    if(!S.key){ throw new Error('Settings এ API key দিন'); }
    const all = await fetchCandles();
    const cs = all.filter(c=>c.done);
    candles.setData(all.map(c=>({time:c.t+off,open:c.o,high:c.h,low:c.l,close:c.c})));
    const {ema,ev} = runStrategy(cs,S.ema);
    emaLine.setData(cs.map((c,i)=>({time:c.t+off,value:ema[i]})));

    // markers + stats (শেষ N কেন্ডেল)
    const start = Math.max(0, cs.length - S.lookback);
    let w=0,m=0,l=0; const mk=[];
    for(const [i,kind,d] of ev){
      if(i<start) continue;
      const time=cs[i].t+off, below=d===1;
      if(kind==='signal') mk.push({time,position:below?'belowBar':'aboveBar',color:below?'#22c55e':'#ef4444',shape:below?'arrowUp':'arrowDown',text:''});
      else if(kind==='win'){w++;mk.push({time,position:below?'belowBar':'aboveBar',color:'#22c55e',shape:'circle',text:'Win ✅'});}
      else if(kind==='mtgwin'){m++;mk.push({time,position:below?'belowBar':'aboveBar',color:'#22c55e',shape:'circle',text:'MTG Win ✅'});}
      else {l++;mk.push({time,position:below?'belowBar':'aboveBar',color:'#ef4444',shape:'circle',text:'Loss ❌'});}
    }
    mk.sort((a,b)=>a.time-b.time);
    candles.setMarkers(mk);
    const tot=w+m+l;
    $('dT').textContent=tot;$('dW').textContent=w;$('dM').textContent=m;$('dL').textContent=l;
    $('dR').textContent=(tot?((w+m)*100/tot).toFixed(1):'0')+'%';

    const last=all[all.length-1];
    $('priceTxt').textContent=`${last.c}  |  EMA${S.ema}: ${ema[ema.length-1].toFixed(5)}`;
    $('pairTxt').textContent=pretty(S.pair);
    $('dot').className='dot ok';

    if(firstFit){chart.timeScale().setVisibleLogicalRange({from:all.length-80,to:all.length+6});firstFit=false;}
    notify(cs,ev);
  }catch(e){
    $('dot').className='dot err';
    $('priceTxt').textContent=e.message;
  }finally{ busy=false; }
}

// ===== Settings UI =====
function openSettings(){
  $('key').value=S.key;$('env').value=S.env;$('pair').value=pretty(S.pair);
  $('ema').value=S.ema;$('lookback').value=S.lookback;
  $('tgToken').value=S.tgToken;$('tgChat').value=S.tgChat;
  $('tgOn').checked=S.tgOn;$('awake').checked=S.awake;
  $('modal').classList.add('open');
}
$('setBtn').onclick=openSettings;
$('closeBtn').onclick=()=>$('modal').classList.remove('open');
$('refreshBtn').onclick=()=>tick();
$('saveBtn').onclick=()=>{
  S.key=$('key').value.trim();S.env=$('env').value;S.pair=normPair($('pair').value||'EURUSD');
  S.ema=Math.max(2,Math.min(200,parseInt($('ema').value)||15));
  S.lookback=Math.max(10,Math.min(4700,parseInt($('lookback').value)||500));
  S.tgToken=$('tgToken').value.trim();S.tgChat=$('tgChat').value.trim();
  S.tgOn=$('tgOn').checked;S.awake=$('awake').checked;
  save();firstFit=true;seen=null;
  $('modal').classList.remove('open');
  keepAwake();tick();
};
$('testBtn').onclick=async()=>{
  S.tgToken=$('tgToken').value.trim();S.tgChat=$('tgChat').value.trim();
  const ok=await tgSend('✅ Test message');
  alert(ok?'Telegram এ পাঠানো হয়েছে':'পাঠানো যায়নি। Token/Chat ID ঠিক আছে কিনা এবং বট channel এর Admin কিনা দেখুন');
};

// ===== Keep screen awake =====
let wl=null;
async function keepAwake(){
  try{
    if(S.awake && 'wakeLock' in navigator){ wl=await navigator.wakeLock.request('screen'); }
    else if(wl){ await wl.release(); wl=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){keepAwake();tick();} });

// ===== Start =====
if(!S.key) openSettings();
keepAwake();
tick();
setInterval(tick,10000);
</script>
</body>
</html>
